<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8"/>
  <style>
    body { font-family: "Microsoft JhengHei", Arial, sans-serif; font-size: 14px; line-height: 1.6; }
    h2 { font-size: 18px; margin: 0 0 8px; }
    ul { margin: 6px 0 12px 20px; }
    .tag { display: inline-block; padding: 2px 6px; border-radius: 6px; background: #ecf0f1; font-size: 12px; }
    .l1 { background: #d4edda; }
    .l2 { background: #f8d7da; }
  </style>
  <title>說明</title>
  </head>
<body>
  <h2>L1 / L2 級別說明</h2>
  <p>應用程式按級別組織檢查項目，以反映優先級及嚴格程度：</p>
  <ul>
    <li><span class="tag l1"><strong>L1</strong></span> — 基礎安全控制，適用範圍廣、對系統影響較小。</li>
    <li><span class="tag l2"><strong>L2</strong></span> — 更嚴格的控制，適用於加固環境；可能影響可用性或需要變更管理。</li>
  </ul>
  <p>你可以使用左側控制按級別篩選或批量選擇。結果會顯示每項的級別，並影響總分。</p>
  <p><strong>提示：</strong>將滑鼠移到表格列可查看細節，亦可使用比較功能查看不同掃描之間的狀態變化。</p>
</body>
</html>
